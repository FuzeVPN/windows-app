# SPDX-License-Identifier: MPL-2.0
name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter, analysis and translations
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:GITHUB_WORKSPACE '.toolchain/flutter'
          New-Item -ItemType Directory -Force (Split-Path $sdk) | Out-Null
          git -c core.longpaths=true clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed.' }
          git -C $sdk config core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout configuration failed.' }
          $revision = (git -C $sdk rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw 'Flutter upstream revision does not match the pinned SDK.'
          }
          $sdkBin = Join-Path $sdk 'bin'
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PUB_CACHE=$(Join-Path $env:RUNNER_TEMP 'pub-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $sdkBin 'flutter.bat') config --no-analytics
          if ($LASTEXITCODE -ne 0) { throw 'Flutter initialization failed.' }
          & (Join-Path $sdkBin 'flutter.bat') precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows test tools are unavailable.' }

      - name: Resolve locked dependencies
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }

      - name: Analyze source
        shell: pwsh
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Source analysis failed.' }

      - name: Check generated translations
        shell: pwsh
        run: |
          dart run tool/l10n/generate_catalogs.dart --check
          if ($LASTEXITCODE -ne 0) { throw 'Translation check failed.' }

      - name: Check generated installer translations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\installer\l10n\generate.ps1 -Check

      - name: Run Flutter tests with isolated storage
        shell: pwsh
        run: |
          $testProfile = Join-Path $env:RUNNER_TEMP 'fuzevpn-test-runtime'
          $testTemp = Join-Path $testProfile 'temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          $env:LOCALAPPDATA = $testProfile
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          flutter test --no-pub --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed.' }

  native:
    name: Native development build (${{ matrix.architecture }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Cache verified public downloads and vcpkg ABI-keyed binaries only.
      # SDK checkouts, build outputs and signing configuration are never cached.
      - name: Restore public dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .toolchain/downloads
            .toolchain/vcpkg-binary-cache
            .toolchain/pub-cache
          key: native-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('tools/dependency-pins.json', 'third_party/openvpn3-core/vcpkg.json', 'third_party/openvpn3-core/vcpkg-configuration.json', 'third_party/openvpn3-core/fuzevpn-vcpkg-overlays/**', 'pubspec.lock') }}

      - name: Prepare pinned public dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\bootstrap-windows.ps1 -Architecture '${{ matrix.architecture }}'

      - name: Build development application and every native test offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\build-windows-multiarch.ps1 -Architecture '${{ matrix.architecture }}' -DevTest -Offline
          Import-Module .\tools\BuildSupport.psm1 -Force
          $tools = Get-FuzeVisualStudioTools -Architecture '${{ matrix.architecture }}'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build/windows/${{ matrix.architecture }}'
          Invoke-FuzeChecked $tools.CMake @('--build', $build, '--config', 'Release', '--target', 'fuzevpn_native_tests', '--parallel', '6')
          if ('${{ matrix.architecture }}' -eq 'x64') {
            Invoke-FuzeChecked $tools.CTest @('--test-dir', $build, '-C', 'Release', '--output-on-failure', '--no-tests=error')
          } else {
            Write-Host 'ARM64 application and native tests compiled; execution needs an ARM64 Windows test machine.'
          }

      - name: Check isolated installer policies and PowerShell contracts
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\tools\BuildSupport.psm1 -Force
          $tools = Get-FuzeVisualStudioTools -Architecture x64
          $build = Join-Path $env:GITHUB_WORKSPACE 'build/ci-installer-tests'
          Invoke-FuzeChecked $tools.CMake @('-S', 'installer', '-B', $build, '-G', 'Visual Studio 18 2026', '-A', 'x64')
          Invoke-FuzeChecked $tools.CMake @('--build', $build, '--config', 'Release', '--parallel', '6')
          Invoke-FuzeChecked $tools.CTest @('--test-dir', $build, '-C', 'Release', '--output-on-failure', '--no-tests=error')
          .\tools\tests\bootstrap-tools-test.ps1
          .\tools\tests\portable-packaging-test.ps1
          .\tools\tests\dco-dependency-test.ps1
          .\tools\tests\openvpn-licensing-test.ps1
          .\tools\tests\native-test-registry-test.ps1
