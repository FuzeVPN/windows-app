# SPDX-License-Identifier: MPL-2.0
name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter, analysis and translations
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git -c core.longpaths=true clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed.' }
          git -C $sdk config core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout configuration failed.' }
          $revision = (git -C $sdk rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw 'Flutter upstream revision does not match the pinned SDK.'
          }
          $sdkBin = Join-Path $sdk 'bin'
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PUB_CACHE=$(Join-Path $env:RUNNER_TEMP 'pub-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $sdkBin 'flutter.bat') config --no-analytics
          if ($LASTEXITCODE -ne 0) { throw 'Flutter initialization failed.' }
          & (Join-Path $sdkBin 'flutter.bat') precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows test tools are unavailable.' }

      - name: Resolve locked dependencies
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }

      - name: Analyze source
        shell: pwsh
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Source analysis failed.' }

      - name: Check generated translations
        shell: pwsh
        run: |
          dart run tool/l10n/generate_catalogs.dart --check
          if ($LASTEXITCODE -ne 0) { throw 'Translation check failed.' }

      - name: Run Flutter tests with isolated storage
        shell: pwsh
        run: |
          $testProfile = Join-Path $env:RUNNER_TEMP 'fuzevpn-test-runtime'
          $testTemp = Join-Path $testProfile 'temp'
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          $env:LOCALAPPDATA = $testProfile
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          flutter test --no-pub --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed.' }
