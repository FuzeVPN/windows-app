name: fuzevpn_windows
description: FuzeVPN Windows client
publish_to: none
version: 1.0.7+1

environment:
  sdk: '>=3.12.2 <3.13.0'
  flutter: '>=3.44.7 <3.45.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  tray_manager: 0.5.3
  url_launcher: 6.3.2

# Local fixes for Windows initialization and actual Shell error reporting.
# This is the same pinned package, with its original license retained.
dependency_overrides:
  tray_manager:
    path: third_party/tray_manager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/fuzevpn-emblem-512.png
    - assets/fonts/Archivo-OFL.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
